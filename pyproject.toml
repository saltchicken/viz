[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz"
version = "0.1.0"
description = "Ollama Vision App"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "textual-image",
    "requests",
    "pillow",
    "tomli; python_version < '3.11'"
]

[project.scripts]
viz = "viz.__main__:main"

[tool.setuptools.package-data]
viz = ["*.tcss"]
